<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Conquista del Mondo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1d33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0b1d33;color:#e8eef6;font-family:Arial,Helvetica,sans-serif;overscroll-behavior:none}
  .app{display:flex;flex-direction:column;height:100%}
  .top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:8px 10px;background:#112a47}
  .stats{display:flex;gap:10px;font-size:13px;flex-wrap:wrap}
  .stats b{color:#fff}
  .btns{display:flex;gap:5px}
  button{font:inherit;font-weight:700;font-size:14px;background:#2f7bd8;color:#fff;border:0;border-radius:6px;padding:8px 11px;cursor:pointer}
  button.sec{background:#33506f}
  button.gold{background:#c98a1a}
  button:disabled{opacity:.4}
  #msgrow{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0e2440;min-height:34px}
  #msg{flex:1;font-size:13px;color:#bcd0e6}
  #train{display:none;padding:5px 9px;font-size:12px;white-space:nowrap}
  #wrap{flex:1;overflow:auto;touch-action:pan-x pan-y;background:#0a2a4a;-webkit-overflow-scrolling:touch}
  svg{display:block;width:900px;height:auto}
  .land{fill:#26453a;stroke:#3b6b57;stroke-width:1}
  .cell{stroke:#0a2a4a;stroke-width:1.2;fill-opacity:.62;transition:fill .25s}
  .edge{stroke:#cfe0f2;stroke-width:1.1;stroke-dasharray:3 3;opacity:.45}
  .edge.sea{stroke:#7ec8ff;stroke-dasharray:1 4;stroke-width:1.6;opacity:.8}
  .t circle.body{stroke:#0b1d33;stroke-width:2.2;cursor:pointer;transition:fill .2s}
  .t text{pointer-events:none;text-anchor:middle;font-weight:800}
  .t .n{font-size:12px;fill:#fff;paint-order:stroke;stroke:#0008;stroke-width:3px}
  .t .nm{font-size:8px;fill:#fff;paint-order:stroke;stroke:#000b;stroke-width:2.5px}
  .t .bk{fill:#5a2d00;stroke:#ffd166;stroke-width:1}
  .t .bt{font-size:7.5px;fill:#fff;text-anchor:start}
  .t.sel circle.body{stroke:#fff;stroke-width:3.5}
  .t circle.ring{fill:none;stroke-width:3;display:none;pointer-events:none}
  .t.ally circle.ring{display:block;stroke:#ffd166}
  .t.win circle.ring{display:block;stroke:#3ddc84}
  .t.lose circle.ring{display:block;stroke:#ff5d5d}
  .t.mv circle.ring{display:block;stroke:#6ec1ff;stroke-dasharray:4 3}
  .t.air circle.ring{display:block;stroke:#ffa94d;stroke-dasharray:2 3}
  .t.hid .n{fill:#cfd8e3}
  .t.done{opacity:.65}
  .t.flash circle.body{stroke:#ffe066;stroke-width:5}
  .atk{stroke:#ffe066;stroke-width:3;stroke-linecap:round;stroke-dasharray:8 6;pointer-events:none;animation:dash .5s linear forwards}
  @keyframes dash{from{stroke-dashoffset:60;opacity:1}to{stroke-dashoffset:0;opacity:.15}}
  .burst{fill:none;stroke-width:4;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:burst .7s ease-out forwards}
  .burst.big{stroke-width:7;animation-duration:1s}
  @keyframes burst{from{transform:scale(1);opacity:1}to{transform:scale(3);opacity:0}}
  #toast{position:fixed;top:92px;left:50%;transform:translateX(-50%) translateY(-20px);background:#ffd166;color:#222;font-weight:700;font-size:13px;padding:8px 14px;border-radius:20px;opacity:0;pointer-events:none;transition:all .3s;z-index:12;max-width:92%;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:9;overflow:auto;padding:12px}
  #ov.show{display:flex}
  .card{background:#112a47;padding:20px;border-radius:12px;text-align:center;max-width:340px;width:100%;max-height:100%;overflow:auto}
  .card h2{margin:0 0 8px}.card p{margin:0 0 14px;color:#bcd0e6;line-height:1.4;font-size:14px}
  .card .stack{display:flex;flex-direction:column;gap:8px}
  #mv{position:fixed;left:0;right:0;bottom:0;background:#112a47;border-top:2px solid #2f7bd8;padding:10px 14px 12px;display:none;z-index:8}
  #mv.show{display:block}
  #mv input{width:100%;margin:4px 0 8px}
  #mv label{font-size:13px;color:#bcd0e6}
  .srow{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:6px}
  .srow input{margin:2px 0!important}
  #bld{position:fixed;left:0;right:0;bottom:0;background:#112a47;border-top:2px solid #c98a1a;padding:10px 14px 12px;display:none;z-index:8}
  #bld.show{display:block}
  #bld .stack{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  #bld button{text-align:left}
  .seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .seg button{background:#33506f;padding:7px 10px;font-size:13px}
  .seg button.on{background:#2f7bd8}
  .hist{text-align:left;font-size:12px;max-height:50vh;overflow:auto}
  .hist div{padding:3px 0;border-top:1px solid #1f3d5e}
  .hist b{color:#ffd166}
  #mv .row{display:flex;gap:6px;justify-content:space-between}
  .legend{display:flex;gap:8px;flex-wrap:wrap;font-size:12px}
  .legend span{display:inline-flex;align-items:center;gap:4px}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .arow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #33506f;text-align:left;font-size:13px}
  .arow i{width:12px;height:12px;border-radius:50%;flex:none}
  .arow div{flex:1}
  .arow small{color:#9fb6cf}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;text-align:left}
  h3{margin:12px 0 4px;font-size:14px;text-align:left}
</style>
</head>

  // ---------- bot
  function okT(p,d){var o=S[d].o;if(o===p)return false;if(o===0&&AL[p])return false;if(o>0&&AB[p][o])return false;return true}
  function hasEnemy(i,p){return adj[i].some(function(d){return S[d].o!==p})}
  function botBuild(p){
    S.forEach(function(s,i){
      if(s.o!==p)return;var c=0;
      while(s.u[0]>=18&&s.u[1]<UN[1].max&&c<2&&Math.random()<.5){s.u[0]-=UN[1].cost;s.u[1]++;c++}
      if(s.u[0]>=24&&Math.random()<.25){var k=Math.random()<.5?2:3;if(s.u[k]<UN[k].max){s.u[0]-=UN[k].cost;s.u[k]++}}
      if(!s.f&&s.u[0]>=40&&hasEnemy(i,p)&&Math.random()<.2){s.u[0]-=FCOST;s.f=true}
    });
  }
  function botReinforce(p){
    S.forEach(function(s,i){
      if(s.o!==p||s.u[0]<12||hasEnemy(i,p))return;
      var best=-1;
      adj[i].forEach(function(d){if(S[d].o===p&&!isSea(i,d)&&S[d].u[0]<MAXT&&hasEnemy(d,p)&&(best<0||S[d].u[0]<S[best].u[0]))best=d});
      if(best<0)adj[i].forEach(function(d){if(S[d].o===p&&!isSea(i,d)&&S[d].u[0]<MAXT&&(best<0||S[d].u[0]<S[best].u[0]))best=d});
      if(best>=0){var n=Math.min(s.u[0]-1,MAXT-S[best].u[0]);if(n>0){s.u[0]-=n;S[best].u[0]+=n}}
    });
  }
  function botForce(A,sea,Pc,maxP){
    var u=A.u,f=[0,0,0,0],rem=Pc,i;
    if(sea){if(u[2]>0)f[2]=1;else if(u[3]>0)f[3]=1;rem-=fsum(f)}
    for(i=1;i<4&&rem>0;i++){var c=Math.min(u[i]-f[i],Math.floor(rem/UN[i].p));f[i]+=c;rem-=c*UN[i].p}
    f[0]=Math.min(u[0]-1,Math.max(0,rem));
    return f;
  }
  async function botPass(p,only,limit,mar,ma){
    var cnt=0,mine=[];
    S.forEach(function(s,i){if(s.o===p)mine.push(i)});
    mine.sort(function(a,b){return pw(S[b])-pw(S[a])});
    for(var k=0;k<mine.length;k++){
      var a=mine[k];
      while(S[a].o===p&&S[a].a<ma&&cnt<limit){
        var A=S[a],best=-1,maxP=A.u[0]-1+A.u[1]*UN[1].p+A.u[2]*UN[2].p+A.u[3]*UN[3].p;
        adj[a].forEach(function(d){
          if(!okT(p,d))return;if(only!=null&&S[d].o!==only)return;
          if(isSea(a,d)&&A.u[2]+A.u[3]===0)return;
          var D=dp(S[d]);
          if(maxP>=Math.floor(D*mar)+1&&maxP>D&&(best<0||D<dp(S[best])))best=d;
        });
        if(best<0)break;
        var Db=dp(S[best]),need=Db+1,Pc=need+Math.floor((maxP-need)/2);
        var f=botForce(A,isSea(a,best),Pc,maxP);
        if(fsum(f)<=Db)f=[A.u[0]-1,A.u[1],A.u[2],A.u[3]];
        var tgt=S[best].o===0,r=attack(a,best,f);cnt++;
        if(r)msg(r);
        draw();await sleep(tgt?800:(r?260:60));
        if(nco(0)===0)return cnt;
      }
    }
    return cnt;
  }
  async function helpAttack(p,q){
    busy=true;UNDO=[];draw();
    if(Math.random()<.3){var t0=PL[p].n+' rifiuta di attaccare '+PL[q].n+'.';msg(t0);logE(t0);busy=false;draw();return}
    msg(PL[p].n+' attacca '+PL[q].n+' per aiutarti…');await sleep(500);
    var n=await botPass(p,q,3,1.0,1);
    var t=n?PL[p].n+' ha attaccato '+PL[q].n+' ('+n+' '+(n===1?'attacco':'attacchi')+').':PL[p].n+' non ha trovato attacchi vantaggiosi contro '+PL[q].n+'.';
    msg(t);logE(t);busy=false;draw();check();

  function randomEvent(){
    if(Math.random()>.35)return;
    var r=rnd(0,C.length-1),s=S[r],t=rnd(1,4),txt;
    if(t===1){s.u[0]=Math.max(1,Math.round(s.u[0]*.7));txt='⚠️ Rivolta in '+C[r][0]+' ('+PL[s.o].n+'): −30% soldati'}
    else if(t===2){s.u[0]=Math.min(MAXT,s.u[0]+15);txt='🎁 Rinforzi in '+C[r][0]+' ('+PL[s.o].n+'): +15 soldati'}
    else if(t===3){var k=rnd(1,3);if(s.u[k]<UN[k].max)s.u[k]++;txt='📦 Rifornimenti in '+C[r][0]+' ('+PL[s.o].n+'): +1 '+UN[k].n.toLowerCase().replace(/i$/,'o')}
    else{var c=CONT[rnd(0,CONT.length-1)];c.ids.forEach(function(i){S[i].u[0]=Math.max(1,Math.round(S[i].u[0]*.85))});txt='🌪️ Tempesta in '+c.n+': −15% soldati ovunque'}
    if(fog&&!seen(r)&&t!==4)txt='❓ Qualcosa è successo in una zona che non vedi';
    toast(txt);logE(txt);
  }
  function newTurn(){
    turn++;UNDO=[];
    var bg=DIFF[diff].gain;
    S.forEach(function(s){s.a=0;s.m=false;s.u[0]=Math.min(MAXT,s.u[0]+(s.o===0?GAIN:bg))});
    CONT.forEach(function(c){
      var o=S[c.ids[0]].o;
      if(c.ids.every(function(i){return S[i].o===o})){
        c.ids.forEach(function(i){S[i].u[0]=Math.min(MAXT,S[i].u[0]+c.b)});
        if(o===0){var t='Bonus '+c.n+': +'+c.b+' soldati per paese';toast(t);logE(t)}
      }
    });
    randomEvent();
    logE('— Turno '+turn+' —');
  }
  $('end').onclick=async function(){
    if(busy||over)return;
    busy=true;sel=null;$('mv').className='';$('bld').className='';mvTo=null;UNDO=[];draw();
    botDiplomacy();
    for(var p=1;p<5;p++){
      if(nco(p)===0)continue;
      if(AL[p]&&(strength(p)>2*strength(0)||Math.random()<.06)){AL[p]=false;LOCK[p]=turn+3;legend();var tt=PL[p].n+' rompe l\'alleanza con te! ⚠️';msg(tt);logE(tt);draw();await sleep(1200)}
      msg('Turno '+PL[p].n+'…');await sleep(300);
      botBuild(p);botReinforce(p);draw();
      await botPass(p,null,99,DIFF[diff].mar,DIFF[diff].att);
      if(nco(0)===0)break;
    }
    if(nco(0)===0){busy=false;check();return}
    newTurn();
    busy=false;draw();check();
    if(!over)msg('Turno '+turn+': +'+GAIN+' soldati per ogni tuo paese, +'+DIFF[diff].gain+' per i bot (max '+MAXT+').');
  };
  var w=900;
  function zoom(f){w=Math.max(500,Math.min(2200,w*f));svg.style.width=w+'px'}
  $('zi').onclick=function(){zoom(1.25)};$('zo').onclick=function(){zoom(.8)};
  $('undo').onclick=undo;
  $('al').onclick=function(){if(!busy&&!over)alPanel()};
  $('info').onclick=function(){if(!busy)infoPanel()};
  $('help').onclick=function(){
    showOv('Come si gioca','<p style="text-align:left">Sei il <b style="color:#2f7bd8">blu</b> contro 4 bot. Tocca un tuo paese: poi un nemico confinante per attaccare (scegli le unità da mandare) o un tuo paese confinante (azzurro) per spostare truppe.<br><br>• Ogni tuo paese attacca fino a 3 volte e sposta una volta per turno.<br>• +10 soldati a turno per ogni tuo paese; i bot meno (dipende dalla difficoltà). Max 100.<br>• <b>🛠 Costruisci</b>: 🚜 carro (T, forza 6), ⚓ nave (N, forza 8), ✈️ aereo (A, forza 10), 🏰 fortezza (F, difesa ×1,5).<br>• I collegamenti <b>azzurri puntinati</b> sono via mare: per attraversarli serve almeno una nave o un aereo.<br>• Gli aerei possono fare raid su paesi a distanza 2 (anello arancio).<br>• Con la 🌫️ nebbia di guerra vedi le truppe solo nei paesi tuoi, alleati o confinanti.<br>• ↶ annulla le mosse del turno; 📊 mostra statistiche e cronologia.<br>• Continenti interi danno bonus; 🤝 alleanze; eventi casuali; salvataggio automatico.</p>','Chiudi');
  };
  if(innerWidth>900){w=Math.min(innerWidth,1500);svg.style.width=w+'px'}
  if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
  newState(1,true);
  startScreen();
  window.__g={get S(){return S},get adj(){return adj},get C(){return C},onClick:onClick,newState:newState,opt:opt,get M(){return M},get UNDO(){return UNDO},reach2:reach2,isSea:isSea};
})();
</script>
